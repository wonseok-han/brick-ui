name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: 버전 PR 생성 또는 배포
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 가 변경 이력을 읽어야 하므로 전체 히스토리가 필요하다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # changeset 이 쌓여 있으면 "Version Packages" PR 을 열거나 갱신하고,
      # 그 PR 이 머지되어 changeset 이 비면 publish 를 수행한다.
      - name: Changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: 패키지 버전 갱신"
          title: "chore: 패키지 버전 갱신"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
