name: Release

# v* 태그를 푸시하면: 빌드 → 산출물 검증 → npm 배포 → GitHub Release 생성
#
# main 푸시로는 절대 발행되지 않는다. 발행하려면 사람이 태그를 달아야 한다.
# "Version Packages" PR 을 머지한 뒤, 그 커밋에 v<버전> 태그를 붙인다.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # GitHub Release 생성
  id-token: write # npm provenance (배포 출처 증명)

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이전 태그를 알아야 비교 링크를 만들 수 있음

      - uses: pnpm/action-setup@v4

      # registry-url 을 주지 않는다: 그러면 setup-node 가 .npmrc 에
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 를 써넣고 NODE_AUTH_TOKEN 을 더미값으로 채운다. npm 은 토큰이 설정돼
      # 있으면 OIDC 를 시도하지 않고 그 더미 토큰으로 publish 해 404 가 난다.
      # 토큰이 없어야 Trusted Publishing(OIDC) 경로를 탄다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing(OIDC) 은 npm 11.5.1+ 필요 (Node 22 기본은 10.x)
      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - name: 빌드
        run: pnpm build --filter="./packages/*"

      # 빌드 성공은 통과 기준이 아니다. sideEffects 설정이 틀어지면 빌드는
      # 성공하면서 CSS 만 조용히 사라진다. --release 는 0.0.0 발행도 막는다.
      - name: 배포 산출물 검증
        run: node scripts/verify-dist.mjs --release

      # 태그와 package.json 버전이 어긋난 채 배포되는 사고 방지.
      # changesets 의 fixed 설정 덕에 @brick/* 는 항상 같은 버전이어야 한다.
      - name: npm 배포 (trusted publishing)
        run: node scripts/publish-packages.mjs --expect-version "${GITHUB_REF_NAME#v}"

      - name: 릴리즈 노트 생성
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > NOTES.md
          echo "----- release notes -----"; cat NOTES.md

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file NOTES.md
